<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixblok - Under Construction</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #ede7df;
            color: #111111;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Fullscreen WebGL/Canvas Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }
        

        /* Subtle Noise Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            opacity: 0.035;
            pointer-events: none;
        }

        /* Main Content Overlay - Fully Dynamic Clamp Relative Scaling */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90vw;
            max-width: 680px;
            padding: clamp(1rem, 4vh, 2.5rem) 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo */
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.15rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: clamp(1.5rem, 5vh, 3.5rem);
            color: #0d0d0d;
            text-transform: lowercase;
            user-select: none;
        }

        /* Title */
        .title {
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.4px;
            color: #111111;
            margin-bottom: clamp(0.75rem, 2.5vh, 1.25rem);
            max-width: 520px;
        }

        /* Description */
        .description {
            font-size: clamp(0.75rem, 1.5vw, 0.85rem);
            line-height: 1.6;
            color: #555;
            margin-bottom: clamp(0.85rem, 2.5vh, 1.25rem);
        }

        .description p {
            margin: 4px 0;
        }

        /* Social Section */
        .social-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.4rem, 1.5vh, 0.75rem);
        }

        .follow-txt {
            font-size: clamp(0.62rem, 1.2vw, 0.72rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666666;
            margin-bottom: clamp(0.35rem, 1.5vh, 0.75rem);
            display: block;
        }

        .social-icons {
            display: flex;
            gap: clamp(0.4rem, 1.2vw, 0.55rem);
            margin-bottom: clamp(0.25rem, 1vh, 0.5rem);
        }

        .social-btn {
            width: clamp(26px, 2.2vw, 30px);
            height: clamp(26px, 2.2vw, 30px);
            border-radius: 50%;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: clamp(0.65rem, 1.2vw, 0.75rem);
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            background-color: #333333;
        }

        .social-btn:active{
            transform: translateY(0) scale(0.98);
        }

        /* Email Link */
        .email-link {
            display: inline-block;
            margin-top: clamp(0.5rem, 1.8vh, 1rem);
            font-size: clamp(0.7rem, 1.3vw, 0.78rem);
            font-weight: 500;
            color: #444;
            text-decoration: none;
            letter-spacing: 0.02em;
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .email-link:hover {
            color: #000;
            border-bottom-color: #000;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: clamp(4px, 1vh, 6px) clamp(10px, 2vw, 14px);
            font-size: clamp(0.65rem, 1.2vw, 0.72rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #444;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 999px;
            margin-bottom: clamp(1rem, 3vh, 1.5rem);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            top: -1px;
        }
    </style>
</head>
<body>

    <!-- Dynamic Canvas Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- Noise Texture Overlay -->
    <canvas id="noiseCanvas" class="noise-overlay"></canvas>

    <!-- Main Content Overlay -->
    <main class="content">
        <div class="brand-badge">
            <span class="status-dot"></span>Madhan Adepu
        </div>

        <h1 class="title">Sorry! My site is<br>under construction</h1>

        <div class="description">
            <p>My portfolio is getting a fresh design and project updates.</p>
            <p>Feel free to connect or reach out below!</p>
        </div>

        <div class="social-section">
            <span class="follow-txt">Connect with me</span>
            <div class="social-icons">
                <a href="https://github.com/madhanio" target="_blank" class="social-btn" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://linkedin.com/in/madhan-adepu" target="_blank" class="social-btn" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>            
            </div>
            <a href="mailto:madhan.adepu9@gmail.com" class="email-link">Drop an email</a>
        </div>
    </main>

    <script>
        // High Performance Rotating Canvas Fluid Gradient
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, radius;
        let angle = 0;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            radius = Math.max(width, height) * 0.75;
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        // Color definitions matching video palette (lightened)
        const baseBg = "#f5f1ec";
        
        // Blobs with orbit parameters (lighter colors & higher transparency)
        const blobs = [
            { r: 250, g: 175, b: 125, a: 0.55, orbitR: 0.38, speed: 0.022, phase: 0, sizeMult: 0.75 },
            { r: 255, g: 195, b: 150, a: 0.50, orbitR: 0.42, speed: -0.018, phase: Math.PI * 0.5, sizeMult: 0.85 },
            { r: 245, g: 160, b: 105, a: 0.40, orbitR: 0.28, speed: 0.028, phase: Math.PI * 1.1, sizeMult: 0.65 },
            { r: 252, g: 210, b: 175, a: 0.45, orbitR: 0.48, speed: -0.015, phase: Math.PI * 1.6, sizeMult: 0.80 }
        ];

        function render() {
            angle += 0.015; // Increased speed (3x faster rotation)

            // Fill base light off-white background
            ctx.fillStyle = baseBg;
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw fluid orbiting & morphing warm gradient blobs
            blobs.forEach((blob) => {
                const currentAngle = angle * (blob.speed / 0.015) + blob.phase;
                
                // Orbiting path calculation
                const x = centerX + Math.cos(currentAngle) * (radius * blob.orbitR) + Math.sin(angle * 1.5) * 50;
                const y = centerY + Math.sin(currentAngle * 0.8) * (radius * blob.orbitR * 0.8) + Math.cos(angle * 1.2) * 50;
                const currentRadius = radius * blob.sizeMult * (1 + Math.sin(angle * 2 + blob.phase) * 0.12);

                const grad = ctx.createRadialGradient(x, y, 0, x, y, currentRadius);
                grad.addColorStop(0, `rgba(${blob.r}, ${blob.g}, ${blob.b}, ${blob.a})`);
                grad.addColorStop(0.4, `rgba(${blob.r}, ${blob.g}, ${blob.b}, ${blob.a * 0.4})`);
                grad.addColorStop(1, `rgba(${blob.r}, ${blob.g}, ${blob.b}, 0)`);

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(render);
        }

        render();

        // Noise overlay generator
        const noiseCanvas = document.getElementById('noiseCanvas');
        if (noiseCanvas) {
            const nCtx = noiseCanvas.getContext('2d');
            function resizeNoise() {
                noiseCanvas.width = window.innerWidth;
                noiseCanvas.height = window.innerHeight;
                generateNoise();
            }
            function generateNoise() {
                const imgData = nCtx.createImageData(noiseCanvas.width, noiseCanvas.height);
                const buffer = new Uint32Array(imgData.data.buffer);
                for (let i = 0; i < buffer.length; i++) {
                    if (Math.random() < 0.5) {
                        buffer[i] = 0xff000000;
                    }
                }
                nCtx.putImageData(imgData, 0, 0);
            }
            window.addEventListener('resize', resizeNoise);
            resizeNoise();
        }
    </script>
</body>
</html>
