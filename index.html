    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #050505 100%);
        }

        .editorial-card {
            padding: 4rem 3rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            margin-bottom: 2rem;
        }

        .editorial-header {
            font-size: 3.5rem;
            font-weight: 200;
            letter-spacing: -1.5px;
            margin-bottom: 1rem;
            color: #ffffff;
            opacity: 0.95;
            min-height: 1.15em;
        }

        /* Blinking cursor after the typewriter text */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 0.85em;
            background: rgba(255,255,255,0.5);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .sub-text {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 3.5rem;
        }

        /* Tech Stack Icons */
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 30px;
            opacity: 0.3;
            transition: opacity 0.5s ease;
        }

        .tech-stack:hover {
            opacity: 0.9;
        }

        .tech-stack svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .tech-stack svg:hover {
            transform: translateY(-5px);
        }

        /* Glassmorphic Floating Dock Bar */
        .dock-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .dock-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        color 0.2s ease, 
                        background-color 0.2s ease,
                        border-color 0.2s ease;
            text-decoration: none;
        }

        .dock-icon:hover {
            transform: scale(1.22) translateY(-4px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .dock-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (max-width: 600px) {
            .editorial-header { font-size: 2.5rem; }
            .editorial-card { padding: 3rem 1.5rem; }
            .tech-stack { gap: 20px; }
            .dock-container { bottom: 16px; padding: 6px 12px; gap: 8px; }
            .dock-icon { width: 38px; height: 38px; }
        }
    </style>
</head>

    <script>
        // Typewriter loop
        const words = ['Compiling.', 'Rendering.', 'Deploying.'];
        let wordIndex = 0;
        let charIndex = 0;
        let deleting = false;
        const el = document.getElementById('typewriter');
        const TYPING_SPEED = 80;
        const DELETING_SPEED = 45;
        const PAUSE_AFTER_WORD = 1800;
        const PAUSE_BEFORE_TYPE = 300;

        function type() {
            const current = words[wordIndex];

            if (deleting) {
                charIndex--;
                el.textContent = current.slice(0, charIndex);
                if (charIndex === 0) {
                    deleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                    setTimeout(type, PAUSE_BEFORE_TYPE);
                    return;
                }
                setTimeout(type, DELETING_SPEED);
            } else {
                charIndex++;
                el.textContent = current.slice(0, charIndex);
                if (charIndex === current.length) {
                    deleting = true;
                    setTimeout(type, PAUSE_AFTER_WORD);
                    return;
                }
                setTimeout(type, TYPING_SPEED);
            }
        }

        type();

        // Console easter egg
        console.log(
            "%c[init] // AMM stack booting.\n\nYou found the source. Let's connect.",
            "color: #aaaaaa; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 300;"
        );
    </script>
