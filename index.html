<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for SEO -->
    <title>Adepu Madhan Mohan | Compiling</title>
    <meta name="description" content="Personal portfolio of Adepu Madhan Mohan, currently under construction.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬛</text></svg>">

    <!-- Typography: Ultra-light 'Inter' for that editorial magazine feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #888888; /* Darker grey for stronger contrast against white */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            
            /* The Pure Midnight Radial */
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #050505 100%);
        }

        /* The Minimalist Glass Container */
        .editorial-card {
            padding: 4rem 3rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
            
            /* Extremely subtle, borderless glass effect */
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        /* High-End Typography */
        .editorial-header {
            font-size: 3.5rem;
            font-weight: 200; /* Very thin */
            letter-spacing: -1.5px;
            margin-bottom: 1rem;
            color: #ffffff;
            opacity: 0.95;
        }

        .sub-text {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 3.5rem;
        }

        /* Ultra-subtle Tech Stack Icons */
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 3.5rem;
            opacity: 0.3; /* Faded out until hovered */
            transition: opacity 0.5s ease;
        }

        .tech-stack:hover {
            opacity: 0.9;
        }

        .tech-stack svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .tech-stack svg:hover {
            transform: translateY(-5px);
        }

        /* Editorial Links (Hover Underline Effect instead of buttons) */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .social-link {
            text-decoration: none;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            position: relative;
            padding-bottom: 4px;
            transition: opacity 0.3s ease;
        }

        /* The sleek growing underline animation */
        .social-link::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: #ffffff;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-link:hover {
            opacity: 1;
        }

        .social-link:hover::after {
            width: 100%;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .editorial-header { font-size: 2.5rem; }
            .editorial-card { padding: 3rem 1.5rem; }
            .tech-stack { gap: 20px; }
        }
    </style>
</head>
