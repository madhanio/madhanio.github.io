<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for SEO and Social Sharing (The "Invisible" Polish) -->
    <title>Adepu Madhan Mohan | Compiling...</title>
    <meta name="description" content="Personal portfolio of Adepu Madhan Mohan, currently under construction.">
    <meta property="og:title" content="Adepu Madhan Mohan - Portfolio">
    <meta property="og:description" content="Something awesome is compiling. Check back soon!">

    <!-- Fonts: 'Inter' for clean text, 'Fira Code' for developer vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Elevated version of your current pink gradient */
            background: linear-gradient(135deg, #d53369 0%, #daae51 100%);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The Stunning Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3.5rem 3rem;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Developer Typography */
        .terminal-header {
            font-family: 'Fira Code', monospace;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.2em;
            background-color: #fff;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Tech Stack Icons Section */
        .tech-stack-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1rem;
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 2.5rem;
        }

        .tech-stack svg {
            width: 32px;
            height: 32px;
            fill: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tech-stack svg:hover {
            fill: #ffffff;
            transform: translateY(-5px) scale(1.1);
        }

        /* Essential Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .terminal-header { font-size: 1.3rem; }
            .glass-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>

    <!-- The JavaScript Magic -->
    <script>
        // Typing Effect Configuration
        const typingText = "> npm run build:portfolio... ";
        const typingSpeed = 80; // Speed in milliseconds
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < typingText.length) {
                document.getElementById("typewriter").innerHTML += typingText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            }
        }

        // Start typing effect on window load
        window.onload = () => {
            setTimeout(typeWriter, 500); // Slight delay before it starts typing

            // ======================================================================
            // EASTER EGG #2: Console Message for Devs
            // ======================================================================
            console.log(
                "%c👨‍💻 Hello fellow dev! \n\nLooks like you're poking around under the hood. \nThe full portfolio is compiling, but since you're here, we should connect on LinkedIn!", 
                "color: #00ff00; font-family: monospace; font-size: 16px; font-weight: bold; background: #111; padding: 20px; border-radius: 8px;"
            );
        };
    </script>
