    .badge-wrapper {

      flex-direction: column;
      align-items: center;

      display: inline-flex;

      justify-content: center;

      will-change: width, transform, opacity;
      transition: transform 0.2s ease;
    }

    .brand-badge.pop-in {
      opacity: 1;

      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;

    /* Perfectly fits "MADHAN ADEPU" */
    .brand-badge.expand-pill {

    /* Paws */

      background: #111111;
      border-radius: 8px 8px 4px 4px;
      z-index: 3;

      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.28);
    }

    .paw::after {
      content: '';
      position: absolute;
      bottom: 1px;
      left: 50%;
      transform: translateX(-50%);

      height: 2.5px;

      margin-bottom: -6px;
      display: flex;
      justify-content: center;

      height: 120px;
      transform: translateY(75px);
      will-change: transform;

    .cat-wrapper.spring-entry {
      transform: translateY(0);
      transition: transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.28);
    }

    .ready-interactive .badge-wrapper:hover .cat-wrapper {
      transform: translateY(-1.5px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

    .pupil {

      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: #111;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s ease, height 0.2s ease;
    }

    .pupil::after {
      content: '';
      position: absolute;
      top: 15%;
      right: 18%;
      width: 32%;
      height: 32%;
      background: #ffffff;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

  <script>
    // 1. Dynamic Year
    document.getElementById("year").textContent = new Date().getFullYear();

    // 2. Ambient Fluid Background Canvas
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, radius;
    let angle = 0;

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      radius = Math.max(width, height) * 0.75;
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    const baseBg = "#f6f0e8";
    const blobs = [
      { r: 248, g: 185, b: 140, a: 0.55, orbitR: 0.38, speed: 0.022, phase: 0, sizeMult: 0.75 },
      { r: 255, g: 205, b: 160, a: 0.50, orbitR: 0.42, speed: -0.018, phase: Math.PI * 0.5, sizeMult: 0.85 },
      { r: 242, g: 170, b: 120, a: 0.40, orbitR: 0.28, speed: 0.028, phase: Math.PI * 1.1, sizeMult: 0.65 },
      { r: 252, g: 215, b: 185, a: 0.45, orbitR: 0.48, speed: -0.015, phase: Math.PI * 1.6, sizeMult: 0.80 }
    ];

    function render() {
      angle += 0.015;
      ctx.fillStyle = baseBg;
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      blobs.forEach((blob) => {
        const currentAngle = angle * (blob.speed / 0.015) + blob.phase;
        const x = centerX + Math.cos(currentAngle) * (radius * blob.orbitR) + Math.sin(angle * 1.5) * 50;
        const y = centerY + Math.sin(currentAngle * 0.8) * (radius * blob.orbitR * 0.8) + Math.cos(angle * 1.2) * 50;
        const currentRadius = radius * blob.sizeMult * (1 + Math.sin(angle * 2 + blob.phase) * 0.12);

        const grad = ctx.createRadialGradient(x, y, 0, x, y, currentRadius);
        grad.addColorStop(0, `rgba(${blob.r}, ${blob.g}, ${blob.b}, ${blob.a})`);
        grad.addColorStop(0.4, `rgba(${blob.r}, ${blob.g}, ${blob.b}, ${blob.a * 0.4})`);
        grad.addColorStop(1, `rgba(${blob.r}, ${blob.g}, ${blob.b}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, currentRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(render);
    }
    render();

    // 3. Film Grain Noise
    const noiseCanvas = document.getElementById('noiseCanvas');
    if (noiseCanvas) {
      const nCtx = noiseCanvas.getContext('2d');
      function resizeNoise() {
        noiseCanvas.width = window.innerWidth;
        noiseCanvas.height = window.innerHeight;
        generateNoise();
      }
      function generateNoise() {
        const imgData = nCtx.createImageData(noiseCanvas.width, noiseCanvas.height);
        const buffer = new Uint32Array(imgData.data.buffer);
        for (let i = 0; i < buffer.length; i++) {
          if (Math.random() < 0.5) {
            buffer[i] = 0xff000000;
          }
        }
        nCtx.putImageData(imgData, 0, 0);
      }
      window.addEventListener('resize', resizeNoise);
      resizeNoise();
    }

    // 4. Bi-Directional Kinetic Text Roller
    const followTxt = document.getElementById('followTxt');
    const defaultText = followTxt.textContent;
    const socialButtons = document.querySelectorAll('.social-btn');
    let rollTimeout = null;

    function rollText(newText, direction = 'up') {
      if (followTxt.textContent === newText) return;
      clearTimeout(rollTimeout);
      followTxt.className = 'follow-txt';

      if (direction === 'up') {
        followTxt.classList.add('roll-out-up');
        rollTimeout = setTimeout(() => {
          followTxt.textContent = newText;
          followTxt.className = 'follow-txt prepare-bottom';
          void followTxt.offsetWidth;
          followTxt.className = 'follow-txt';
        }, 140);
      } else {
        followTxt.classList.add('roll-out-down');
        rollTimeout = setTimeout(() => {
          followTxt.textContent = newText;
          followTxt.className = 'follow-txt prepare-top';
          void followTxt.offsetWidth;
          followTxt.className = 'follow-txt';
        }, 140);
      }
    }

    socialButtons.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const hoverText = btn.getAttribute('data-hover');
        if (hoverText) rollText(hoverText, 'up');
      });
      btn.addEventListener('mouseleave', () => {
        rollText(defaultText, 'down');
      });
    });

    // 5. Hero Cat Lead-In Sequence
    const brandBadge = document.getElementById('brandBadge');
    const cat = document.getElementById('cat');
    const catGroup = document.getElementById('catGroup');
    const eyesGroup = document.getElementById('eyesGroup');
    const pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];
    const eyes = document.querySelectorAll('.eye');
    const MAX_PX = 2.5;

    let isIntroPlaying = true;
    let petTimeout = null;

    const catQuotes = [
      "Purrrrr... 🐾",
      "Meow! What's up?",
      "Caught me bug hunting! 🐛",
      "Chef is busy cooking! 🍳",
      "Psst... stalk my code below!",
      "Nice to meet you! ✨"
    ];

    function runStartupSequence() {
      // Step 1 (t = 80ms): Dot + Circle Pill Pop in
      setTimeout(() => {
        brandBadge.classList.add('pop-in');
      }, 80);

      // Step 2 (t = 380ms): Circle expands into snug pill
      setTimeout(() => {
        brandBadge.classList.add('expand-pill');
      }, 380);

      // Step 3 (t = 980ms): Cat springs up + Paws appear
      setTimeout(() => {
        cat.classList.add('spring-entry');
        brandBadge.classList.add('show-paws');
      }, 980);

      // Step 4 (t = 1420ms): Cat looks down naturally at the page
      setTimeout(() => {
        eyesGroup.classList.add('look-down');
      }, 1420);

      // Step 5 (t = 1680ms): Content dissolves in sequentially
      setTimeout(() => {
        document.getElementById('itemHeadline').classList.add('revealed');
      }, 1680);

      setTimeout(() => {
        document.getElementById('itemDescription').classList.add('revealed');
      }, 1840);

      setTimeout(() => {
        document.getElementById('itemSocial').classList.add('revealed');
      }, 2000);

      setTimeout(() => {
        document.getElementById('itemFooter').classList.add('revealed');
      }, 2180);

      // Step 6 (t = 2400ms): Sequence Complete -> Resume Live Eye Tracking
      setTimeout(() => {
        eyesGroup.classList.remove('look-down');
        document.body.classList.add('ready-interactive');
        isIntroPlaying = false;
      }, 2400);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runStartupSequence);
    } else {
      runStartupSequence();
    }

    // 6. Continuous Eye Tracking
    function trackEyes(cx, cy) {
      if (!eyes.length || isIntroPlaying) return;
      eyes.forEach((eye, i) => {
        const rect = eye.getBoundingClientRect();
        const eyeCx = rect.left + rect.width / 2;
        const eyeCy = rect.top + rect.height / 2;
        const angle = Math.atan2(cy - eyeCy, cx - eyeCx);
        const dist = Math.min(MAX_PX, Math.hypot(cx - eyeCx, cy - eyeCy) / 18);
        pupils[i].style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
      });
    }

    // Natural Blinking
    function scheduleBlink() {
      const nextBlink = Math.random() * 3500 + 3500;
      setTimeout(() => {
        if (!isIntroPlaying) {
          eyes.forEach(e => e.classList.add('blinking'));
          setTimeout(() => {
            eyes.forEach(e => e.classList.remove('blinking'));
            scheduleBlink();
          }, 150);
        } else {
          scheduleBlink();
        }
      }, nextBlink);
    }
    scheduleBlink();

    window.addEventListener('mousemove', e => {
      trackEyes(e.clientX, e.clientY);
    });

    // Pet / Click Reaction
    function petCat() {
      if (isIntroPlaying) return;
      catGroup.classList.add('petting');
      
      const randomQuote = catQuotes[Math.floor(Math.random() * catQuotes.length)];
      rollText(randomQuote, 'up');

      clearTimeout(petTimeout);
      petTimeout = setTimeout(() => {
        catGroup.classList.remove('petting');
        rollText(defaultText, 'down');
      }, 2200);
    }

    catGroup.addEventListener('click', petCat);

    // 7. Invisible Power-User Keyboard Easter Eggs
    window.addEventListener('keydown', (e) => {
      if (isIntroPlaying) return;

      const key = e.key.toLowerCase();

      if (e.code === 'Space' || key === 'c') {
        e.preventDefault();
        petCat();
      } else if (key === 'g') {
        window.open('https://github.com/madhanio', '_blank');
      } else if (key === 'l') {
        window.open('https://linkedin.com/in/madhan-adepu', '_blank');
      } else if (key === 'm') {
        window.location.href = 'mailto:madhan.adepu9@gmail.com';
      }
    });
  </script>
